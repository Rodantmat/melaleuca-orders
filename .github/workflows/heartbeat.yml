name: Heartbeat (keeps the status pages and reprice on time)
# GitHub's own cron is late and patchy. This job stays alive for ~5h40m, starts the status update every
# 15 minutes, the web Buy Box scan and the reprice every 4 hours (6 slots a day), then starts the next heartbeat. The hourly cron below
# only restarts the chain if it ever breaks (concurrency keeps a single heartbeat alive).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: heartbeat
  cancel-in-progress: false
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Beat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          exec > >(tee -a /tmp/hb.log) 2>&1
          start=$(date +%s); end=$((start+20400))
          last_status=0
          while :; do
            now=$(date +%s)
            # status update every 15 min, unless one is already queued or running
            if [ $((now-last_status)) -ge 870 ]; then
              busy=$(gh api "repos/$REPO/actions/workflows/status_auto.yml/runs?per_page=5" -q '[.workflow_runs[]|select(.status!="completed")]|length' 2>/dev/null || echo 0)
              if [ "${busy:-0}" = "0" ]; then
                gh api -X POST "repos/$REPO/actions/workflows/status_auto.yml/dispatches" -f ref=main -f inputs[mode]=auto >/dev/null 2>&1 && echo "status dispatched $(date -u +%H:%M)" || echo "status dispatch failed"
              fi
              last_status=$now
            fi
            # reprice slots (UTC): the first beat after 03:17 / 07:17 / 11:17 / 15:17 / 19:17 / 23:17, once per slot (OWNER 2026-11-27: every 4 h, so stock changes and Buy Box moves are answered within hours)
            hm=$(date -u +%H%M); h=$((10#${hm:0:2})); m=$((10#${hm:2:2})); mins=$((h*60+m))
            for slot in 197 437 677 917 1157 1397; do
              if [ $mins -ge $slot ] && [ $mins -lt $((slot+20)) ]; then
                recent=$(gh api "repos/$REPO/actions/workflows/reprice.yml/runs?per_page=3" -q "[.workflow_runs[]|select((.created_at|fromdateiso8601) > $((now-10800)))]|length" 2>/dev/null || echo 0)
                if [ "${recent:-0}" = "0" ]; then
                  gh api -X POST "repos/$REPO/actions/workflows/reprice.yml/dispatches" -f ref=main >/dev/null 2>&1 && echo "reprice dispatched $(date -u +%H:%M)" || echo "reprice dispatch failed"
                fi
              fi
            done
            # web Buy Box scan slots (UTC): the first beat after 02:30 / 06:30 / 10:30 / 14:30 / 18:30 / 22:30, ~45 min before each reprice slot, once per slot (HTML only, ~25 MB per scan)
            for slot in 150 390 630 870 1110 1350; do
              if [ $mins -ge $slot ] && [ $mins -lt $((slot+20)) ]; then
                recent=$(gh api "repos/$REPO/actions/workflows/bb_web.yml/runs?per_page=3" -q "[.workflow_runs[]|select((.created_at|fromdateiso8601) > $((now-10800)))]|length" 2>/dev/null || echo 0)
                if [ "${recent:-0}" = "0" ]; then
                  gh api -X POST "repos/$REPO/actions/workflows/bb_web.yml/dispatches" -f ref=main >/dev/null 2>&1 && echo "web scan dispatched $(date -u +%H:%M)" || echo "web scan dispatch failed"
                fi
              fi
            done
            [ $(date +%s) -ge $end ] && break
            sleep 60
          done
          gh api -X POST "repos/$REPO/actions/workflows/heartbeat.yml/dispatches" -f ref=main >/dev/null && echo "next heartbeat started"
      - name: Journal this run (permanent run history on branch ops-log)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 reprice/opslog.py heartbeat "${{ job.status }}" /tmp/hb.log 'dispatched' 'dispatch failed' 'next heartbeat' 'HTTP' || true
