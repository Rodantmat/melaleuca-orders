name: SKU existence check
on:
  workflow_dispatch:
    inputs:
      watch: { description: "SKUs to show in detail (space separated)", default: "ME0016 ME0048 ME0083", required: false }
permissions:
  contents: write
concurrency: { group: skucheck, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch seller id
        run: git fetch origin reprice-state:reprice-state 2>/dev/null && git checkout reprice-state -- reprice/state/seller.txt 2>/dev/null || true
      - name: Check
        env: { CRED_ENV: "${{ format('PROXY_URL={1}{0}STICKY_BASE=10000{0}HEADLESS=1{0}MAIL_MODE=send{0}GMAIL_USER={2}{0}GMAIL_APP_PASSWORD={3}{0}SHIPPO_LIVE_TOKEN={4}{0}MELA_USER_1={5}{0}MELA_PASS_1={6}{0}MELA_USER_2={7}{0}MELA_PASS_2={8}{0}MELA_USER_3={9}{0}MELA_PASS_3={10}{0}MELA_USER_4={11}{0}MELA_PASS_4={12}{0}MELA_USER_5={13}{0}MELA_PASS_5={14}{0}MELA_USER_6={15}{0}MELA_PASS_6={16}{0}MELA_USER_7={17}{0}MELA_PASS_7={18}{0}MELA_USER_8={19}{0}MELA_PASS_8={20}{0}MELA_USER_9={21}{0}MELA_PASS_9={22}{0}MELA_USER_10={23}{0}MELA_PASS_10={24}{0}MELA_USER_11={25}{0}MELA_PASS_11={26}{0}MELA_USER_12={27}{0}MELA_PASS_12={28}{0}MELA_USER_13={29}{0}MELA_PASS_13={30}{0}MELA_USER_14={31}{0}MELA_PASS_14={32}{0}MELA_USER_15={33}{0}MELA_PASS_15={34}{0}MELA_USER_16={35}{0}MELA_PASS_16={36}{0}MELA_USER_17={37}{0}MELA_PASS_17={38}{0}APIFY_TOKEN={39}{0}DATABASE_URL={40}{0}R2_ACCOUNT_ID={41}{0}R2_BUCKET={42}{0}R2_ACCESS_KEY_ID={43}{0}R2_SECRET_ACCESS_KEY={44}{0}', fromJSON('\"\\n\"'), secrets.PROXY_URL, secrets.GMAIL_USER, secrets.GMAIL_APP_PASSWORD, secrets.SHIPPO_LIVE_TOKEN, secrets.MELA_USER_1, secrets.MELA_PASS_1, secrets.MELA_USER_2, secrets.MELA_PASS_2, secrets.MELA_USER_3, secrets.MELA_PASS_3, secrets.MELA_USER_4, secrets.MELA_PASS_4, secrets.MELA_USER_5, secrets.MELA_PASS_5, secrets.MELA_USER_6, secrets.MELA_PASS_6, secrets.MELA_USER_7, secrets.MELA_PASS_7, secrets.MELA_USER_8, secrets.MELA_PASS_8, secrets.MELA_USER_9, secrets.MELA_PASS_9, secrets.MELA_USER_10, secrets.MELA_PASS_10, secrets.MELA_USER_11, secrets.MELA_PASS_11, secrets.MELA_USER_12, secrets.MELA_PASS_12, secrets.MELA_USER_13, secrets.MELA_PASS_13, secrets.MELA_USER_14, secrets.MELA_PASS_14, secrets.MELA_USER_15, secrets.MELA_PASS_15, secrets.MELA_USER_16, secrets.MELA_PASS_16, secrets.MELA_USER_17, secrets.MELA_PASS_17, secrets.APIFY_TOKEN, secrets.DATABASE_URL, secrets.R2_ACCOUNT_ID, secrets.R2_BUCKET, secrets.R2_ACCESS_KEY_ID, secrets.R2_SECRET_ACCESS_KEY) }}", AMZ_CLIENT: "${{ secrets.AMZ_CLIENT }}", AMZ_SECRET: "${{ secrets.AMZ_SECRET }}", AMZ_REFRESH: "${{ secrets.AMZ_REFRESH }}" }
        run: |
          set -o pipefail
          cd reprice
          printf '%s\n' "$CRED_ENV" > credentials.env
          if [ -n "$AMZ_SECRET" ] && [ -n "$AMZ_REFRESH" ]; then
            grep -v -i -E '^[[:space:]]*(CLIENT_ID|CLIENT_SECRET|REFRESH_TOKEN)[[:space:]]*=' credentials.env > credentials.env.tmp; mv credentials.env.tmp credentials.env
            printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\nREFRESH_TOKEN=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" "$AMZ_REFRESH" >> credentials.env
          elif [ -n "$AMZ_SECRET" ]; then printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" >> credentials.env; fi
          python sku_check.py ${{ github.event.inputs.watch }} 2>&1 | tee sku_check.log
          rm -f credentials.env
      - name: Publish
        if: always()
        run: |
          git config user.name "feed-bot"; git config user.email "feed-bot@users.noreply.github.com"
          rm -rf /tmp/so && mkdir -p /tmp/so
          cp reprice/state/sku_check.tsv reprice/sku_check.log /tmp/so/ 2>/dev/null || true
          find . -name credentials.env -not -path "./.git/*" -delete  # SCRUB secrets before anything is committed
          git checkout --orphan sku-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/so/. .
          find . -name 'credentials.*' -not -path './.git/*' -delete; git add -A && git commit -qm "sku check" && git push -f origin sku-new:sku-check
