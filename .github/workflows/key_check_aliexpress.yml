name: key-check-aliexpress
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.ALIEXPRESS_APP_KEY }}
          S: ${{ secrets.ALIEXPRESS_APP_SECRET }}
        run: |
          python3 - <<'EOF'
          import os,hmac,hashlib,time,urllib.request,urllib.parse
          k=os.environ['K'];s=os.environ['S']
          print('key_len',len(k),'secret_len',len(s))
          p={'app_key':k,'timestamp':str(int(time.time()*1000)),'sign_method':'sha256','method':'aliexpress.affiliate.category.get'}
          b=''.join(a+p[a] for a in sorted(p))
          p['sign']=hmac.new(s.encode(),b.encode(),hashlib.sha256).hexdigest().upper()
          try:
            r=urllib.request.urlopen('https://api-sg.aliexpress.com/sync?'+urllib.parse.urlencode(p),timeout=30).read().decode()
          except Exception as e:
            r=str(e)
          print(r[:300])
          EOF
