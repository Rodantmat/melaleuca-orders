name: Shippo test probe
on:
  workflow_dispatch:
    inputs:
      script: { default: shippo_test.py }
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run
        env:
          SHIPPO_API_KEY: ${{ secrets.SHIPPO_API_KEY }}
          SHIPPO_LIVE_TOKEN: ${{ secrets.SHIPPO_LIVE_TOKEN }}
          SHIPPO_LIVE_API_KEY: ${{ secrets.SHIPPO_LIVE_API_KEY }}
          SHIPPO_LIVE_KEY: ${{ secrets.SHIPPO_LIVE_KEY }}
          CREDENTIALS_ENV: ${{ format('PROXY_URL={1}{0}STICKY_BASE=10000{0}HEADLESS=1{0}MAIL_MODE=send{0}GMAIL_USER={2}{0}GMAIL_APP_PASSWORD={3}{0}SHIPPO_LIVE_TOKEN={4}{0}MELA_USER_1={5}{0}MELA_PASS_1={6}{0}MELA_USER_2={7}{0}MELA_PASS_2={8}{0}MELA_USER_3={9}{0}MELA_PASS_3={10}{0}MELA_USER_4={11}{0}MELA_PASS_4={12}{0}MELA_USER_5={13}{0}MELA_PASS_5={14}{0}MELA_USER_6={15}{0}MELA_PASS_6={16}{0}MELA_USER_7={17}{0}MELA_PASS_7={18}{0}MELA_USER_8={19}{0}MELA_PASS_8={20}{0}MELA_USER_9={21}{0}MELA_PASS_9={22}{0}MELA_USER_10={23}{0}MELA_PASS_10={24}{0}MELA_USER_11={25}{0}MELA_PASS_11={26}{0}MELA_USER_12={27}{0}MELA_PASS_12={28}{0}MELA_USER_13={29}{0}MELA_PASS_13={30}{0}MELA_USER_14={31}{0}MELA_PASS_14={32}{0}MELA_USER_15={33}{0}MELA_PASS_15={34}{0}MELA_USER_16={35}{0}MELA_PASS_16={36}{0}MELA_USER_17={37}{0}MELA_PASS_17={38}{0}APIFY_TOKEN={39}{0}DATABASE_URL={40}{0}R2_ACCOUNT_ID={41}{0}R2_BUCKET={42}{0}R2_ACCESS_KEY_ID={43}{0}R2_SECRET_ACCESS_KEY={44}{0}', fromJSON('"\n"'), secrets.PROXY_URL, secrets.GMAIL_USER, secrets.GMAIL_APP_PASSWORD, secrets.SHIPPO_LIVE_TOKEN, secrets.MELA_USER_1, secrets.MELA_PASS_1, secrets.MELA_USER_2, secrets.MELA_PASS_2, secrets.MELA_USER_3, secrets.MELA_PASS_3, secrets.MELA_USER_4, secrets.MELA_PASS_4, secrets.MELA_USER_5, secrets.MELA_PASS_5, secrets.MELA_USER_6, secrets.MELA_PASS_6, secrets.MELA_USER_7, secrets.MELA_PASS_7, secrets.MELA_USER_8, secrets.MELA_PASS_8, secrets.MELA_USER_9, secrets.MELA_PASS_9, secrets.MELA_USER_10, secrets.MELA_PASS_10, secrets.MELA_USER_11, secrets.MELA_PASS_11, secrets.MELA_USER_12, secrets.MELA_PASS_12, secrets.MELA_USER_13, secrets.MELA_PASS_13, secrets.MELA_USER_14, secrets.MELA_PASS_14, secrets.MELA_USER_15, secrets.MELA_PASS_15, secrets.MELA_USER_16, secrets.MELA_PASS_16, secrets.MELA_USER_17, secrets.MELA_PASS_17, secrets.APIFY_TOKEN, secrets.DATABASE_URL, secrets.R2_ACCOUNT_ID, secrets.R2_BUCKET, secrets.R2_ACCESS_KEY_ID, secrets.R2_SECRET_ACCESS_KEY) }}
        run: |
          mkdir -p /tmp/so
          python ship/${{ inputs.script }} 2>&1 | tee /tmp/so/run.log
      - name: Publish
        if: always()
        run: |
          git config user.name "ship-bot"; git config user.email "ship-bot@users.noreply.github.com"
          git checkout --orphan sh-new
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/so/. .
          git add -A && git commit -qm "shippo test" && git push -f origin sh-new:shippo-test
