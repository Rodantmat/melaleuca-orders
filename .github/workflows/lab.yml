name: Melaleuca lab (test bench)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "script in local/ to run"
        default: "melaleuca_probe2.py"
      args:
        description: "arguments"
        default: "7"
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium && sudo apt-get install -y xvfb
      - name: Run
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          U1: ${{ secrets.MELA_USER_1 }}
          P1: ${{ secrets.MELA_PASS_1 }}
          CRED_ENV: ${{ format('PROXY_URL={1}{0}STICKY_BASE=10000{0}HEADLESS=1{0}MAIL_MODE=send{0}GMAIL_USER={2}{0}GMAIL_APP_PASSWORD={3}{0}SHIPPO_LIVE_TOKEN={4}{0}MELA_USER_1={5}{0}MELA_PASS_1={6}{0}MELA_USER_2={7}{0}MELA_PASS_2={8}{0}MELA_USER_3={9}{0}MELA_PASS_3={10}{0}MELA_USER_4={11}{0}MELA_PASS_4={12}{0}MELA_USER_5={13}{0}MELA_PASS_5={14}{0}MELA_USER_6={15}{0}MELA_PASS_6={16}{0}MELA_USER_7={17}{0}MELA_PASS_7={18}{0}MELA_USER_8={19}{0}MELA_PASS_8={20}{0}MELA_USER_9={21}{0}MELA_PASS_9={22}{0}MELA_USER_10={23}{0}MELA_PASS_10={24}{0}MELA_USER_11={25}{0}MELA_PASS_11={26}{0}MELA_USER_12={27}{0}MELA_PASS_12={28}{0}MELA_USER_13={29}{0}MELA_PASS_13={30}{0}MELA_USER_14={31}{0}MELA_PASS_14={32}{0}MELA_USER_15={33}{0}MELA_PASS_15={34}{0}MELA_USER_16={35}{0}MELA_PASS_16={36}{0}MELA_USER_17={37}{0}MELA_PASS_17={38}{0}APIFY_TOKEN={39}{0}DATABASE_URL={40}{0}R2_ACCOUNT_ID={41}{0}R2_BUCKET={42}{0}R2_ACCESS_KEY_ID={43}{0}R2_SECRET_ACCESS_KEY={44}{0}', fromJSON('"\n"'), secrets.PROXY_URL, secrets.GMAIL_USER, secrets.GMAIL_APP_PASSWORD, secrets.SHIPPO_LIVE_TOKEN, secrets.MELA_USER_1, secrets.MELA_PASS_1, secrets.MELA_USER_2, secrets.MELA_PASS_2, secrets.MELA_USER_3, secrets.MELA_PASS_3, secrets.MELA_USER_4, secrets.MELA_PASS_4, secrets.MELA_USER_5, secrets.MELA_PASS_5, secrets.MELA_USER_6, secrets.MELA_PASS_6, secrets.MELA_USER_7, secrets.MELA_PASS_7, secrets.MELA_USER_8, secrets.MELA_PASS_8, secrets.MELA_USER_9, secrets.MELA_PASS_9, secrets.MELA_USER_10, secrets.MELA_PASS_10, secrets.MELA_USER_11, secrets.MELA_PASS_11, secrets.MELA_USER_12, secrets.MELA_PASS_12, secrets.MELA_USER_13, secrets.MELA_PASS_13, secrets.MELA_USER_14, secrets.MELA_PASS_14, secrets.MELA_USER_15, secrets.MELA_PASS_15, secrets.MELA_USER_16, secrets.MELA_PASS_16, secrets.MELA_USER_17, secrets.MELA_PASS_17, secrets.APIFY_TOKEN, secrets.DATABASE_URL, secrets.R2_ACCOUNT_ID, secrets.R2_BUCKET, secrets.R2_ACCESS_KEY_ID, secrets.R2_SECRET_ACCESS_KEY) }}
          AMZ_CLIENT: ${{ secrets.AMZ_CLIENT }}
          AMZ_SECRET: ${{ secrets.AMZ_SECRET }}
          AMZ_REFRESH: ${{ secrets.AMZ_REFRESH }}
          FILL_CLEAR: "1"
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
          LC_ALL: "C"
          PYTHONIOENCODING: "ascii:replace"
        run: |
          cd local
          if [ -n "$CRED_ENV" ]; then
            printf '%s\n' "$CRED_ENV" > credentials.env
            if [ -n "$AMZ_SECRET" ] && [ -n "$AMZ_REFRESH" ]; then
              grep -v -i -E '^[[:space:]]*(CLIENT_ID|CLIENT_SECRET|REFRESH_TOKEN)[[:space:]]*=' credentials.env > credentials.env.tmp; mv credentials.env.tmp credentials.env
              printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\nREFRESH_TOKEN=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" "$AMZ_REFRESH" >> credentials.env
            elif [ -n "$AMZ_SECRET" ]; then printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" >> credentials.env; fi
            grep -q '^PROXY_URL=' credentials.env || printf 'PROXY_URL=%s\n' "$PROXY_URL" >> credentials.env
            grep -q '^STICKY_BASE=' credentials.env || printf 'STICKY_BASE=10000\n' >> credentials.env
          else
            printf 'PROXY_URL=%s\nSTICKY_BASE=10000\nMELA_USER_7=%s\nMELA_PASS_7=%s\n' "$PROXY_URL" "$U1" "$P1" > credentials.env
          fi
          xvfb-run -a python ${{ github.event.inputs.script }} ${{ github.event.inputs.args }} 2>&1 | tee ../lab.log
          rm -f credentials.env
        continue-on-error: true
      - name: Save results to branch lab-results
        if: always()
        run: |
          git config user.name "lab-bot"; git config user.email "lab-bot@users.noreply.github.com"
          mkdir -p /tmp/res && cp lab.log /tmp/res/ ; cp -r local/feed /tmp/res/feed; rm -rf /tmp/res/feed/plans 2>/dev/null || true
          rm -rf /tmp/res/feed/debug/*.png
          find . -name credentials.env -not -path "./.git/*" -delete  # SCRUB secrets before anything is committed
          git checkout --orphan lab-results-${{ github.run_id }}
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results && cp -r /tmp/res/* results/
          find . -name 'credentials.*' -not -path './.git/*' -delete; git add results && git commit -m "lab results" && git push -f origin lab-results-${{ github.run_id }}
