name: key_check_r2
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R2 write/read/delete test and guard
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip -q install boto3
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,"temu")
          from r2_guard import client, usage, ok_to_upload
          s3=client(); b=os.environ["R2_BUCKET"]
          print("bucket", b, "acct_len", len(os.environ["R2_ACCOUNT_ID"]), "key_len", len(os.environ["R2_ACCESS_KEY_ID"]), "secret_len", len(os.environ["R2_SECRET_ACCESS_KEY"]))
          print("guard says ok to upload 1KB:", ok_to_upload(s3,b,1024))
          s3.put_object(Bucket=b, Key="_selftest/hello.txt", Body=b"hello r2")
          print("get:", s3.get_object(Bucket=b, Key="_selftest/hello.txt")["Body"].read())
          print("usage bytes,objects:", usage(s3,b))
          s3.delete_object(Bucket=b, Key="_selftest/hello.txt")
          print("after delete:", usage(s3,b))
          try:
              s3.list_buckets(); print("WARN: token can list buckets (broader than expected)")
          except Exception as e:
              print("list_buckets denied (good, token is bucket-scoped):", type(e).__name__)
          PY
