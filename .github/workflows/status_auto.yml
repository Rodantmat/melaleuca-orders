name: Status pages - automatic updates
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | all (read all 17 accounts now) | status (check every carrier now)"
        default: "auto"
permissions:
  contents: write
concurrency:
  group: status-auto
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scrape: ${{ steps.p.outputs.scrape }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: status-site
          path: site
      - uses: actions/checkout@v4
        with:
          ref: status-state
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: What is due now?
        id: p
        env:
          STATUS_SALT: ${{ secrets.STATUS_SALT }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python status/auto.py plan --site site --state state --mode "$MODE"
  scrape:
    needs: plan
    if: needs.plan.outputs.scrape != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        acct: ${{ fromJSON(needs.plan.outputs.scrape) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install --with-deps chromium && sudo apt-get install -y xvfb
      - name: Read the order history of one account (text only, through the proxy)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MELA_USER_1: ${{ secrets.MELA_USER_1 }}
          MELA_PASS_1: ${{ secrets.MELA_PASS_1 }}
          MELA_USER_2: ${{ secrets.MELA_USER_2 }}
          MELA_PASS_2: ${{ secrets.MELA_PASS_2 }}
          MELA_USER_3: ${{ secrets.MELA_USER_3 }}
          MELA_PASS_3: ${{ secrets.MELA_PASS_3 }}
          MELA_USER_4: ${{ secrets.MELA_USER_4 }}
          MELA_PASS_4: ${{ secrets.MELA_PASS_4 }}
          MELA_USER_5: ${{ secrets.MELA_USER_5 }}
          MELA_PASS_5: ${{ secrets.MELA_PASS_5 }}
          MELA_USER_6: ${{ secrets.MELA_USER_6 }}
          MELA_PASS_6: ${{ secrets.MELA_PASS_6 }}
          MELA_USER_7: ${{ secrets.MELA_USER_7 }}
          MELA_PASS_7: ${{ secrets.MELA_PASS_7 }}
          MELA_USER_8: ${{ secrets.MELA_USER_8 }}
          MELA_PASS_8: ${{ secrets.MELA_PASS_8 }}
          MELA_USER_9: ${{ secrets.MELA_USER_9 }}
          MELA_PASS_9: ${{ secrets.MELA_PASS_9 }}
          MELA_USER_10: ${{ secrets.MELA_USER_10 }}
          MELA_PASS_10: ${{ secrets.MELA_PASS_10 }}
          MELA_USER_11: ${{ secrets.MELA_USER_11 }}
          MELA_PASS_11: ${{ secrets.MELA_PASS_11 }}
          MELA_USER_12: ${{ secrets.MELA_USER_12 }}
          MELA_PASS_12: ${{ secrets.MELA_PASS_12 }}
          MELA_USER_13: ${{ secrets.MELA_USER_13 }}
          MELA_PASS_13: ${{ secrets.MELA_PASS_13 }}
          MELA_USER_14: ${{ secrets.MELA_USER_14 }}
          MELA_PASS_14: ${{ secrets.MELA_PASS_14 }}
          MELA_USER_15: ${{ secrets.MELA_USER_15 }}
          MELA_PASS_15: ${{ secrets.MELA_PASS_15 }}
          MELA_USER_16: ${{ secrets.MELA_USER_16 }}
          MELA_PASS_16: ${{ secrets.MELA_PASS_16 }}
          MELA_USER_17: ${{ secrets.MELA_USER_17 }}
          MELA_PASS_17: ${{ secrets.MELA_PASS_17 }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AMZ_CLIENT: ${{ secrets.AMZ_CLIENT }}
          AMZ_SECRET: ${{ secrets.AMZ_SECRET }}
          AMZ_REFRESH: ${{ secrets.AMZ_REFRESH }}
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
          LC_ALL: "C"
          PYTHONIOENCODING: "ascii:replace"
        run: |
          cd local
          env | grep -E '^(MELA_(USER|PASS)_[0-9]+|GMAIL_USER|GMAIL_APP_PASSWORD|SHIPPO_LIVE_TOKEN)=' > credentials.env || true
          if [ -n "$AMZ_SECRET" ] && [ -n "$AMZ_REFRESH" ]; then
            grep -v -i -E '^[[:space:]]*(CLIENT_ID|CLIENT_SECRET|REFRESH_TOKEN)[[:space:]]*=' credentials.env > credentials.env.tmp; mv credentials.env.tmp credentials.env
            printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\nREFRESH_TOKEN=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" "$AMZ_REFRESH" >> credentials.env
          elif [ -n "$AMZ_SECRET" ]; then printf 'CLIENT_ID=%s\nCLIENT_SECRET=%s\n' "$AMZ_CLIENT" "$AMZ_SECRET" >> credentials.env; fi
          grep -q '^PROXY_URL=' credentials.env || printf 'PROXY_URL=%s\n' "$PROXY_URL" >> credentials.env
          grep -q '^STICKY_BASE=' credentials.env || printf 'STICKY_BASE=10000\n' >> credentials.env
          cd ../status
          xvfb-run -a python scrape.py ${{ matrix.acct }} --out ../out
          rm -f ../local/credentials.env
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "acct-${{ matrix.acct }}"
          path: out/acct_${{ matrix.acct }}.json
          retention-days: 1
          if-no-files-found: ignore
  publish:
    needs: [plan, scrape]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: status-site
          path: site
      - uses: actions/checkout@v4
        with:
          ref: status-state
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: "acct-*"
          path: out
          merge-multiple: true
      - name: Apply (accounts read, carrier status, state, pages)
        env:
          STATUS_SALT: ${{ secrets.STATUS_SALT }}
          SHIPPO_LIVE_TOKEN: ${{ secrets.SHIPPO_LIVE_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          mkdir -p out
          python status/auto.py publish --site site --state state --in out --mode "$MODE"
      - name: Publish pages and state
        run: |
          for d in site state; do
            ( cd $d
              git config user.name "status-bot"; git config user.email "status-bot@users.noreply.github.com"
              find . -name 'credentials.*' -not -path './.git/*' -delete; python3 "$GITHUB_WORKSPACE/tools/leakcheck.py" . || exit 1; git add -A
              if ! git diff --cached --quiet; then
                git commit -qm "status $(date -u +%F_%H%M)"
                b=$(git rev-parse --abbrev-ref HEAD)
                for i in 1 2 3; do git push origin HEAD:$b && break; git pull -q --rebase origin $b; done
              fi )
          done
